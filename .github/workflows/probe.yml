name: Probe source reachability (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in https://www.kruachieve.com/feed/ https://www.kroobannok.com/rss.php https://www.krupatom.com/feed/ https://www.vec.go.th/feed/ https://otepc.go.th/th/feed https://www.opec.go.th/feed/ https://www.secondary.go.th/feed/ https://www.dla.go.th/feed/ https://www.nst2.go.th/feed/ https://www.kruthai.info/feed/ https://www.obec.go.th/category/news/feed/; do
            echo "$u -> $(curl -4 -sL -o /tmp/f -m 25 -A 'PingKhanaBot/0.1 (+https://github.com/Vector033/PingKhana)' -w '%{http_code} %{content_type}' $u || echo fail) items=$(grep -c '<item>' /tmp/f 2>/dev/null)"
          done
