# Render Blueprint for the API only. Postgres lives on Neon (Render's free Postgres is deleted
# after 30 days) and the website on Vercel. Setup steps: docs/line-setup.md.
services:
  - type: web
    name: pingkhana-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    buildFilter:
      paths:
        - backend/**
    envVars:
      # Values marked sync: false are typed into the Render dashboard, never committed.
      - key: DATABASE_URL
        sync: false
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: LINE_LOGIN_CHANNEL_ID
        sync: false
      - key: LIFF_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: PUBLIC_WEB_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: JOBS_TOKEN
        generateValue: true
